# Local run of both apps: `make up`, then http://localhost:3000.
# The frontend runs its dev server, so edits under apps/web/src reload live.
# Emails sent by the API land in Mailcatcher: http://localhost:1080.
services:
  api:
    build: ./apps/api
    environment:
      SMTP_ADDR: mailcatcher:1025
    ports:
      - '8080:8080'
    depends_on:
      - mailcatcher

  web:
    build: ./apps/web
    environment:
      API_URL: http://api:8080
    ports:
      - '3000:3000'
    volumes:
      - ./apps/web/src:/app/src
    depends_on:
      - api

  mailcatcher:
    image: sj26/mailcatcher:latest
    ports:
      - '1025:1025' # SMTP
      - '1080:1080' # web UI
